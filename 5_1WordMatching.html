<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단어 매칭게임 - Travel</title>

<style>
  :root{
    --bg:#e0f2fe;
    --text:#0f172a;
    --eng:#60A5FA;   /* 영어 카드 색 */
    --kor:#34D399;   /* 한국어 카드 색 */
  }

  body{
    margin:0; padding:20px;
    background:linear-gradient(135deg,#bae6fd,#e0f2fe);
    font-family:system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }

  h1{margin:0 0 10px;}

  #stats{
    font-size:1.1rem;
    margin-bottom:15px;
  }

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:12px;
    max-width:800px;
    width:100%;
  }

  .card{
    height:90px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:12px;
    box-shadow:0 3px 6px #0002;
    cursor:pointer;
    font-size:1.1rem;
    font-weight:600;
    user-select:none;
    transition:transform .2s;
    color:white;
    padding:6px;
    text-align:center;
    line-height:1.3;
  }

  .card:hover{ transform:scale(1.04); }

  .eng{ background:var(--eng); }
  .kor{ background:var(--kor); }

  .hide{
    visibility:hidden;
    pointer-events:none;
  }

  .shake{
    animation:shake .3s;
  }

  @keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    50%{transform:translateX(6px)}
    75%{transform:translateX(-6px)}
    100%{transform:translateX(0)}
  }

  #restart{
    margin-top:20px;
    padding:10px 18px;
    background:#38bdf8;
    color:white; border:none; border-radius:10px;
    font-size:1.05rem;
    cursor:pointer;
  }
</style>
</head>
<body>

<h1>단어 매칭게임 - Travel</h1>

<div id="stats">
  남은 쌍: <span id="remain"></span> |
  시간: <span id="time">0.0</span>s |
  최고기록: <span id="best">-</span>s
</div>

<div id="grid"></div>

<button id="restart">다시 시작</button>

<script>
// 영어 - 한국어 쌍
const pairs = [
  ["arrive","도착하다"],
  ["train","기차 / 훈련하다"],
  ["stay","머무르다"],
  ["there","거기에, 그곳에"],
  ["leave","떠나다"],
  ["soon","곧"],
  ["come","오다"],
  ["start","시작하다"],
  ["guide","안내하다 / 안내인 / 가이드"],
  ["show","보여주다"]
];

// 카드 데이터 생성: 영어 / 뜻 따로 만들어서 색 다르게
let cards = [];
pairs.forEach(p=>{
  cards.push({text:p[0], key:p[0], type:"eng"});
  cards.push({text:p[1], key:p[0], type:"kor"});
});

// 섞기
cards = cards.sort(()=>Math.random()-0.5);

const grid = document.getElementById("grid");
const remainSpan = document.getElementById("remain");
const timeSpan = document.getElementById("time");
const bestSpan = document.getElementById("best");

let first = null;
let lock = false;
let remainCount = pairs.length;

let startTime = null;
let timer = null;

function startTimer(){
  startTime = performance.now();
  timer = setInterval(()=>{
    timeSpan.textContent = ((performance.now()-startTime)/1000).toFixed(1);
  },100);
}

function stopTimer(){
  clearInterval(timer);
  const t = parseFloat(timeSpan.textContent);
  let best = localStorage.getItem("bestMatchTimeTravel");
  if(!best || t < best){
    localStorage.setItem("bestMatchTimeTravel", t);
  }
  bestSpan.textContent = localStorage.getItem("bestMatchTimeTravel");
}

function init(){
  grid.innerHTML="";
  remainCount = pairs.length;
  remainSpan.textContent = remainCount;

  timeSpan.textContent="0.0";
  let best = localStorage.getItem("bestMatchTimeTravel");
  bestSpan.textContent = best ? best : "-";

  first=null; lock=false;
  startTime=null;

  // 다시 섞기
  cards = cards.sort(()=>Math.random()-0.5);

  cards.forEach((c)=>{
    const div = document.createElement("div");
    div.className = "card " + c.type;
    div.textContent = c.text;
    div.dataset.key = c.key;
    grid.appendChild(div);

    div.addEventListener("click", ()=>{
      if(lock || div.classList.contains("hide")) return;

      if(!first){
        first = div;
        if(!startTime) startTimer();
        return;
      }

      if(first === div) return;

      if(first.dataset.key === div.dataset.key){
        // 정답
        first.classList.add("hide");
        div.classList.add("hide");

        remainCount--;
        remainSpan.textContent = remainCount;

        first = null;

        if(remainCount === 0){
          stopTimer();
        }
      } else {
        // 오답
        lock = true;
        div.classList.add("shake");
        first.classList.add("shake");
        setTimeout(()=>{
          div.classList.remove("shake");
          first.classList.remove("shake");
          first=null;
          lock=false;
        },350);
      }
    });
  });
}

document.getElementById("restart").addEventListener("click",()=>{
  stopTimer();
  init();
});

init();
</script>

</body>
</html>
