<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단어 칩 클릭해서 문장 완성하기</title>
<style>
  :root{
    --bg1:#1d4ed8;
    --bg2:#0f172a;
    --card:#ffffffdd;
    --chip:#e2e8f0;
    --chip-hover:#cbd5e1;
    --accent:#2563eb;
    --accent2:#0ea5e9;
    --correct:#22c55e;
    --wrong:#ef4444;
    --text:#0f172a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
    color:var(--text);
    font-size:1.3rem; /* 글씨 약간 크게 */
  }
  .wrap{
    max-width:960px;
    width:66%;                  /* 화면의 2/3 정도 */
    background:var(--card);
    border-radius:18px;
    box-shadow:0 18px 45px rgba(15,23,42,.4);
    padding:18px 16px 20px;
    backdrop-filter:blur(12px);
  }
  @media (max-width:900px){
    .wrap{width:100%;}
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .title{
    font-weight:700;
    font-size:1.15rem;
  }
  .progress{
    font-size:1rem;
    color:#475569;
    font-weight:600;
  }

  .hint{
    background:#e0f2fe;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:12px;
    font-size:1.05rem;
    font-weight:600;
  }

  .sentence-box{
    border-radius:14px;
    border:1px dashed #cbd5e1;
    background:#f8fafc;
    min-height:80px;
    padding:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:14px;
  }
  .sentence-placeholder{
    font-size:1.05rem;
    color:#94a3b8;
    font-weight:500;
  }

  .chips-box{
    border-radius:14px;
    border:1px solid #e2e8f0;
    background:#eef2ff;
    min-height:90px;
    padding:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:flex-start;
  }

  .chip{
    padding:7px 14px;
    border-radius:999px;
    background:var(--chip);
    cursor:pointer;
    font-size:1.05rem;
    font-weight:700;  /* 칩은 볼드 */
    transition:.15s;
    box-shadow:0 1px 4px rgba(15,23,42,.18);
    user-select:none;
  }
  .chip:hover{
    background:var(--chip-hover);
    transform:translateY(-1px);
  }

  .controls{
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  button{
    border:none;
    border-radius:999px;
    padding:8px 16px;
    font-size:0.95rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-weight:600;
  }
  .btn-main{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
  }
  .btn-sub{
    background:#e2e8f0;
    color:#0f172a;
  }
  .btn-next{
    background:#22c55e;
    color:white;
  }

  .feedback{
    margin-top:10px;
    min-height:1.3em;
    font-size:1.05rem;
    font-weight:600;
  }
  .feedback.ok{color:var(--correct);}
  .feedback.no{color:var(--wrong);}

  @media (max-width:640px){
    body{font-size:1.1rem;}
    .sentence-box{min-height:90px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">단어 칩을 클릭해서 문장을 완성해 보세요</div>
    <div class="progress"><span id="currentNum">1</span> / <span id="totalNum">0</span> 문장</div>
  </header>

  <div class="hint" id="hintBox"></div>

  <div class="sentence-box" id="answerBox">
    <span class="sentence-placeholder" id="placeholder">아래 단어 칩을 클릭해서 문장을 만들어 보세요.</span>
  </div>

  <div class="chips-box" id="chipsBox"></div>

  <div class="controls">
    <button class="btn-main" id="checkBtn">정답 확인</button>
    <button class="btn-sub" id="undoBtn">되돌리기</button>
    <button class="btn-sub" id="clearBtn">지우기</button>
    <button class="btn-sub" id="shuffleBtn">다시 섞기</button>
    <button class="btn-next" id="nextBtn">다음 문장 ▶</button>
  </div>

  <div class="feedback" id="feedback"></div>
</div>

<script>
const items = [
  { en: "The pillow is not clean.",              ko: "그 베개는 깨끗하지 않다." },
  { en: "The hotel is over there.",              ko: "그 호텔은 저기에 있다." },
  { en: "The tickets are cheap.",                ko: "그 표들은 싸다." },
  { en: "The night view is wonderful.",          ko: "그 야경은 정말 멋지다." },
  { en: "Our hotel room is big.",                ko: "우리 호텔 방은 크다." },
  { en: "The bed is very clean.",                ko: "그 침대는 매우 깨끗하다." },
  { en: "The pillow is red.",                    ko: "그 베개는 빨간색이다." },
  { en: "The food is cheap.",                    ko: "그 음식은 싸다." },
  { en: "The concert tickets are not cheap.",    ko: "그 콘서트 표는 싸지 않다." },
  { en: "Our hotel room is small.",              ko: "우리 호텔 방은 작다." },
  { en: "Our hotel is clean.",                   ko: "우리 호텔은 깨끗하다." },
  { en: "My pillow is not small.",               ko: "내 베개는 작지 않다." },
  { en: "The food is very delicious.",           ko: "그 음식은 매우 맛있다." }
];

const hintBox    = document.getElementById("hintBox");
const answerBox  = document.getElementById("answerBox");
const chipsBox   = document.getElementById("chipsBox");
const placeholder= document.getElementById("placeholder");
const feedback   = document.getElementById("feedback");
const currentNum = document.getElementById("currentNum");
const totalNum   = document.getElementById("totalNum");

const checkBtn   = document.getElementById("checkBtn");
const undoBtn    = document.getElementById("undoBtn");
const clearBtn   = document.getElementById("clearBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const nextBtn    = document.getElementById("nextBtn");

let idx = 0;
let historyStack = [];

totalNum.textContent = items.length;

function shuffle(arr){
  return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
}

function clearAnswer(){
  const chips = [...answerBox.querySelectorAll(".chip")];
  chips.forEach(chip=>{
    chip.remove();
    chipsBox.appendChild(chip);
    chip.dataset.location = "pool";
  });
  placeholder.style.display = "";
}

function buildSentence(i){
  const item = items[i];
  idx = i;
  currentNum.textContent = i+1;
  feedback.textContent = "";
  feedback.className = "feedback";
  historyStack = [];

  hintBox.textContent = item.ko;

  const clean = item.en.replace(/[.?!]$/,"");
  const words = clean.split(" ");

  chipsBox.innerHTML = "";
  answerBox.innerHTML = "";
  answerBox.appendChild(placeholder);
  placeholder.style.display = "";

  const shuffled = shuffle(words.slice());
  shuffled.forEach(word=>{
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = word;
    chip.dataset.word = word;
    chip.dataset.location = "pool";
    chip.addEventListener("click", onChipClick);
    chipsBox.appendChild(chip);
  });
}

function onChipClick(e){
  const chip = e.currentTarget;
  const from = chip.dataset.location;

  saveHistory();

  if(from === "pool"){
    placeholder.style.display = "none";
    answerBox.appendChild(chip);
    chip.dataset.location = "answer";
  }else{
    chipsBox.appendChild(chip);
    chip.dataset.location = "pool";
    if(answerBox.querySelectorAll(".chip").length === 0){
      placeholder.style.display = "";
    }
  }
}

function saveHistory(){
  const poolWords   = [...chipsBox.querySelectorAll(".chip")].map(c=>c.dataset.word);
  const answerWords = [...answerBox.querySelectorAll(".chip")].map(c=>c.dataset.word);
  historyStack.push({pool:poolWords, answer:answerWords});
  if(historyStack.length > 50) historyStack.shift();
}

function restoreFromHistory(){
  if(historyStack.length === 0) return;
  const last = historyStack.pop();

  const allChips = [...chipsBox.querySelectorAll(".chip"), ...answerBox.querySelectorAll(".chip")];
  allChips.forEach(c=>c.remove());

  const byWord = {};
  allChips.forEach(c=>{ byWord[c.dataset.word] = c; });

  chipsBox.innerHTML = "";
  answerBox.innerHTML = "";
  answerBox.appendChild(placeholder);

  last.pool.forEach(w=>{
    const c = byWord[w];
    chipsBox.appendChild(c);
    c.dataset.location = "pool";
  });
  last.answer.forEach(w=>{
    const c = byWord[w];
    answerBox.appendChild(c);
    c.dataset.location = "answer";
  });

  placeholder.style.display = last.answer.length ? "none" : "";
}

function checkAnswer(){
  const item = items[idx];
  const clean = item.en.replace(/[.?!]$/,"");
  const target = clean.split(" ");
  const answerWords = [...answerBox.querySelectorAll(".chip")].map(c=>c.dataset.word);

  if(answerWords.length === 0){
    feedback.textContent = "먼저 단어 칩을 클릭해 문장을 만들어 보세요.";
    feedback.className = "feedback no";
    return;
  }

  const ok = target.length === answerWords.length &&
             target.every((w,i)=>w === answerWords[i]);

  if(ok){
    feedback.textContent = "정답입니다! 🎉";
    feedback.className = "feedback ok";
  }else{
    feedback.textContent = "아쉬워요. 단어 순서를 다시 한 번 확인해 보세요.";
    feedback.className = "feedback no";
  }
}

checkBtn.addEventListener("click", checkAnswer);
undoBtn.addEventListener("click", restoreFromHistory);
clearBtn.addEventListener("click", ()=>{
  historyStack.push(null);
  clearAnswer();
  feedback.textContent = "";
  feedback.className = "feedback";
});
shuffleBtn.addEventListener("click", ()=>{
  buildSentence(idx);
});
nextBtn.addEventListener("click", ()=>{
  const next = (idx + 1) % items.length;
  buildSentence(next);
});

buildSentence(0);
</script>
</body>
</html>
