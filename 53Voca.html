<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 플래시카드 - 영어 발음 전용</title>
    <style>
        /* 플래시카드 전체 컨테이너 스타일 */
        .card-container {
            display: flex;
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center;
            padding: 20px;
        }

        /* 개별 플래시카드 스타일 */
        .flashcard {
            width: 300px;
            height: 200px;
            perspective: 1000px; 
            cursor: pointer; 
            user-select: none; 
        }

        /* 카드 내부 (앞면/뒷면 포함) 스타일 */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s; 
            transform-style: preserve-3d; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        /* 카드가 뒤집혔을 때의 스타일 */
        .flashcard.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* 앞면과 뒷면 공통 스타일 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            line-height: 1.5;
        }

        /* 앞면 스타일 */
        .card-front {
            background-color: #4CAF50; 
            color: white;
        }

        /* 뒷면 스타일 */
        .card-back {
            background-color: #f1f1f1; 
            color: #333;
            transform: rotateY(180deg); 
            font-size: 20px;
        }

        .hint {
            font-size: 14px;
            font-weight: normal;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContainer">
        </div>

    <script>
        const flashcards = [
            { front: "visit", back: "방문하다" },
            { front: "museum", back: "박물관" },
            { front: "suitcase", back: "여행 가방, 수트케이스" },
            { front: "order", back: "주문하다" },
            { front: "pack", back: "짐을 싸다" },
            { front: "book", back: "예매하다, 예약하다" },
            { front: "flight", back: "항공편, 비행기" },
            { front: "souvenir", back: "기념품" },
            { front: "shop", back: "가게, 쇼핑하다" },
            { front: "restaurant", back: "식당, 레스토랑" }
        ];

        const container = document.getElementById('cardContainer');
        let selectedVoice = null;

        // **발음 품질 개선을 위해 최적의 영어 음성을 선택하는 함수**
        function setEnglishVoice() {
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                
                // 1. "en-US" 언어 코드의 음성을 찾습니다.
                const englishVoices = voices.filter(voice => voice.lang.startsWith('en-')); 
                
                if (englishVoices.length > 0) {
                    // 2. Google, Microsoft, Karen (Mac) 등 비교적 품질이 좋은 음성을 우선 찾습니다.
                    const highQualityVoice = englishVoices.find(voice => 
                        voice.name.includes('Google') || 
                        voice.name.includes('Microsoft') || 
                        voice.name.includes('Karen') // Mac users
                    ) || englishVoices[0]; // 없으면 첫 번째 음성 선택

                    selectedVoice = highQualityVoice;
                    console.log('선택된 영어 음성:', selectedVoice ? selectedVoice.name : '기본 음성');
                } else {
                    console.warn('사용 가능한 영어 음성을 찾을 수 없습니다. 기본값으로 설정됩니다.');
                }
            }
        }

        // 브라우저에서 음성 목록을 로드하는 이벤트 리스너를 추가합니다.
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = setEnglishVoice;
            // 이미 로드되었을 경우를 대비하여 한 번 호출합니다.
            setEnglishVoice(); 
        }

        // 텍스트를 읽어주는 함수 (Web Speech API)
        function speak(text) {
            if ('speechSynthesis' in window) {
                // 이미 발음 중이라면 멈춥니다.
                window.speechSynthesis.cancel(); 

                const utterance = new SpeechSynthesisUtterance(text);
                
                utterance.lang = 'en-US'; // 항상 영어 발음으로 설정
                utterance.rate = 1.0; 

                // 설정된 최적의 음성을 적용
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("이 브라우저에서는 음성 합성을 지원하지 않습니다.");
            }
        }

        // 각 단어에 대한 플래시카드 생성 함수
        function createCard(data) {
            const flashcard = document.createElement('div');
            flashcard.className = 'flashcard';
            
            const cardInner = document.createElement('div');
            cardInner.className = 'card-inner';

            const cardFront = document.createElement('div');
            cardFront.className = 'card-face card-front';
            cardFront.innerHTML = `<div>${data.front}</div>`;

            const cardBack = document.createElement('div');
            cardBack.className = 'card-face card-back';
            cardBack.innerHTML = `
                <div>${data.front}</div>
                <div style="font-size: 18px; font-weight: normal; margin-top: 10px;">(${data.back})</div>
                <div class="hint">클릭하면 영어 단어를 다시 읽어줍니다.</div>
            `; 

            cardInner.appendChild(cardFront);
            cardInner.appendChild(cardBack);
            flashcard.appendChild(cardInner);

            // 클릭 이벤트 리스너: 카드 뒤집기 + 영어 단어 읽어주기
            flashcard.addEventListener('click', function() {
                this.classList.toggle('flipped');
                
                // 앞/뒷면 관계없이 항상 영어 단어(data.front)를 읽어줍니다.
                speak(data.front);
            });

            container.appendChild(flashcard);
        }

        // 모든 플래시카드 생성 시작
        flashcards.forEach(card => createCard(card));
    </script>

</body>
</html>
